<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract checklist illustration of five questions to ask before signing a contract">
  <defs>
    <style>.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }</style>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#032D60"/>

  <!-- grid -->
  <g stroke="#0B5CAB" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
  </g>

  <text x="64" y="72" class="mono" font-size="13" font-weight="500" fill="#03B4A7" letter-spacing="1.5">FIVE QUESTIONS BEFORE YOU SIGN</text>

  <!-- large numeral 05 motif -->
  <text x="600" y="360" class="mono" font-size="220" font-weight="500" fill="#043a75">05</text>

  <!-- checklist panel -->
  <g transform="translate(64, 116)">
    <rect x="0" y="0" width="420" height="264" rx="12" fill="#043a75" stroke="#0B5CAB" stroke-width="1.5"/>
    <!-- header bar -->
    <path d="M0 12 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v22 h-420 z" fill="#032D60"/>
    <circle cx="20" cy="17" r="4" fill="#03B4A7"/>
    <text x="34" y="21" class="mono" font-size="10" font-weight="500" fill="#5C6470">DUE-DILIGENCE.MD</text>

    <!-- checklist rows -->
    <g class="mono" font-size="12" font-weight="500">
      <!-- row 1 checked -->
      <rect x="24" y="60" width="20" height="20" rx="4" fill="none" stroke="#03B4A7" stroke-width="1.8"/>
      <path d="M28 70 l5 5 l9 -11" fill="none" stroke="#03B4A7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="75" fill="#EEF6FD">Who reviews the AI's output?</text>

      <!-- row 2 checked -->
      <rect x="24" y="98" width="20" height="20" rx="4" fill="none" stroke="#03B4A7" stroke-width="1.8"/>
      <path d="M28 108 l5 5 l9 -11" fill="none" stroke="#03B4A7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="113" fill="#EEF6FD">Who owns the code you ship?</text>

      <!-- row 3 checked -->
      <rect x="24" y="136" width="20" height="20" rx="4" fill="none" stroke="#03B4A7" stroke-width="1.8"/>
      <path d="M28 146 l5 5 l9 -11" fill="none" stroke="#03B4A7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="151" fill="#EEF6FD">What is the test coverage bar?</text>

      <!-- row 4 checked -->
      <rect x="24" y="174" width="20" height="20" rx="4" fill="none" stroke="#03B4A7" stroke-width="1.8"/>
      <path d="M28 184 l5 5 l9 -11" fill="none" stroke="#03B4A7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="189" fill="#EEF6FD">How is scope change handled?</text>

      <!-- row 5 empty (pending) -->
      <rect x="24" y="212" width="20" height="20" rx="4" fill="none" stroke="#5C6470" stroke-width="1.8"/>
      <text x="56" y="227" fill="#5C6470">Who is on call after launch?</text>
    </g>
  </g>
</svg>
