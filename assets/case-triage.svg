<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract routing tree representing a case triage engine">
  <defs>
    <style>.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }</style>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#F7F9FB"/>

  <!-- grid -->
  <g stroke="#E3E7ED" stroke-width="1" opacity="0.7">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
  </g>

  <text x="64" y="72" class="mono" font-size="13" font-weight="500" fill="#7526E3" letter-spacing="1.5">CASE TRIAGE ENGINE</text>

  <!-- routing connectors -->
  <g fill="none" stroke="#5C6470" stroke-width="1.8">
    <path d="M180 210 H 300"/>
    <!-- branch out of decision node -->
    <path d="M356 210 C 420 210, 440 130, 540 130"/>
    <path d="M356 210 C 420 210, 440 210, 540 210"/>
    <path d="M356 210 C 420 210, 440 300, 540 300"/>
  </g>
  <!-- decision diamond -->
  <g transform="translate(328, 210)">
    <path d="M0 -30 L 30 0 L 0 30 L -30 0 Z" fill="#EEF6FD" stroke="#0176D3" stroke-width="2"/>
    <path d="M-9 0 l6 6 l12 -13" fill="none" stroke="#0176D3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- inbound case -->
  <g>
    <rect x="72" y="184" width="108" height="52" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
    <path d="M92 202 h20 M92 210 h20 M92 218 h12" stroke="#5C6470" stroke-width="1.8" stroke-linecap="round"/>
    <text x="120" y="230" text-anchor="middle" class="mono" font-size="10" font-weight="500" fill="#16181D">NEW CASE</text>
  </g>

  <!-- routed queues -->
  <g class="mono" font-size="10" font-weight="500">
    <!-- tier 1 -->
    <rect x="540" y="104" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#0176D3" stroke-width="1.5"/>
    <circle cx="562" cy="130" r="7" fill="none" stroke="#0176D3" stroke-width="1.8"/>
    <text x="580" y="127" fill="#16181D">TIER 1 · SELF-SERVE</text>
    <text x="580" y="140" fill="#5C6470">auto-resolve</text>

    <!-- tier 2 -->
    <rect x="540" y="184" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#03B4A7" stroke-width="1.5"/>
    <rect x="555" y="203" width="14" height="14" rx="3" fill="none" stroke="#03B4A7" stroke-width="1.8"/>
    <text x="580" y="207" fill="#16181D">TIER 2 · SPECIALIST</text>
    <text x="580" y="220" fill="#5C6470">skill-based route</text>

    <!-- escalation -->
    <rect x="540" y="274" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#BA0517" stroke-width="1.5"/>
    <path d="M555 306 l7 -13 l7 13 z" fill="none" stroke="#BA0517" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="580" y="297" fill="#16181D">ESCALATION</text>
    <text x="580" y="310" fill="#5C6470">human architect</text>
  </g>

  <!-- metric card -->
  <g transform="translate(72, 336)">
    <rect x="0" y="0" width="188" height="56" rx="8" fill="#EEF6FD" stroke="#0176D3" stroke-width="1.5"/>
    <text x="16" y="26" class="mono" font-size="11" font-weight="500" fill="#5C6470">FIRST-CONTACT RESOLVE</text>
    <text x="16" y="46" class="mono" font-size="18" font-weight="500" fill="#0B5CAB">+27%</text>
  </g>

  <!-- provenance pill -->
  <g transform="translate(548, 366)">
    <rect x="0" y="0" width="188" height="30" rx="15" fill="#FFFFFF" stroke="#0176D3" stroke-width="1.5"/>
    <circle cx="18" cy="15" r="4" fill="#7526E3"/>
    <text x="32" y="19" class="mono" font-size="10" font-weight="500" fill="#0B5CAB">LEAD: SENIOR ARCHITECT</text>
  </g>
</svg>
