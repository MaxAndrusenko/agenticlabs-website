<svg viewBox="0 0 560 400" width="560" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram of connected Salesforce systems and integration lines">
  <defs>
    <style>.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }</style>
  </defs>

  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>

  <!-- faint grid -->
  <g stroke="#E3E7ED" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="560" y2="100"/>
    <line x1="0" y1="200" x2="560" y2="200"/>
    <line x1="0" y1="300" x2="560" y2="300"/>
    <line x1="140" y1="0" x2="140" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="420" y1="0" x2="420" y2="400"/>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#5C6470" stroke-width="1.6">
    <path d="M132 90 L 250 190"/>
    <path d="M428 90 L 310 190"/>
    <path d="M130 320 L 250 220"/>
    <path d="M430 320 L 310 220"/>
    <path d="M280 158 L 280 60" stroke-dasharray="4 5"/>
  </g>
  <!-- flow direction dots -->
  <g fill="#0176D3">
    <circle cx="191" cy="140" r="3.5"/>
    <circle cx="369" cy="140" r="3.5"/>
    <circle cx="190" cy="270" r="3.5"/>
    <circle cx="370" cy="270" r="3.5"/>
  </g>

  <!-- central integration hub -->
  <rect x="228" y="160" width="104" height="80" rx="12" fill="#EEF6FD" stroke="#0176D3" stroke-width="2"/>
  <g transform="translate(280, 200)">
    <circle r="16" fill="none" stroke="#0176D3" stroke-width="2"/>
    <path d="M-8 0 h16 M0 -8 v16" stroke="#0176D3" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="280" y="228" text-anchor="middle" class="mono" font-size="10" font-weight="500" fill="#0B5CAB">INTEGRATION</text>

  <!-- top marker -->
  <rect x="238" y="28" width="84" height="26" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
  <path d="M252 41 l5 5 l9 -10" fill="none" stroke="#03B4A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="272" y="45" class="mono" font-size="10" font-weight="500" fill="#5C6470">SYNC</text>

  <!-- corner systems -->
  <!-- top-left -->
  <g>
    <rect x="40" y="52" width="112" height="52" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
    <circle cx="64" cy="78" r="9" fill="none" stroke="#0176D3" stroke-width="1.8"/>
    <text x="82" y="74" class="mono" font-size="10" font-weight="500" fill="#16181D">SALES</text>
    <text x="82" y="87" class="mono" font-size="10" font-weight="500" fill="#5C6470">CLOUD</text>
  </g>
  <!-- top-right -->
  <g>
    <rect x="408" y="52" width="112" height="52" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
    <rect x="428" y="70" width="16" height="16" rx="3" fill="none" stroke="#0176D3" stroke-width="1.8"/>
    <text x="452" y="74" class="mono" font-size="10" font-weight="500" fill="#16181D">SERVICE</text>
    <text x="452" y="87" class="mono" font-size="10" font-weight="500" fill="#5C6470">CLOUD</text>
  </g>
  <!-- bottom-left -->
  <g>
    <rect x="40" y="296" width="112" height="52" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
    <path d="M60 314 h16 M60 322 h16 M60 330 h10" stroke="#03B4A7" stroke-width="1.8" stroke-linecap="round"/>
    <text x="84" y="318" class="mono" font-size="10" font-weight="500" fill="#16181D">ERP</text>
    <text x="84" y="331" class="mono" font-size="10" font-weight="500" fill="#5C6470">SYSTEM</text>
  </g>
  <!-- bottom-right -->
  <g>
    <rect x="408" y="296" width="112" height="52" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
    <path d="M428 330 l6 -8 l6 6 l6 -10" fill="none" stroke="#7526E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="318" class="mono" font-size="10" font-weight="500" fill="#16181D">AGENT</text>
    <text x="452" y="331" class="mono" font-size="10" font-weight="500" fill="#5C6470">FORCE</text>
  </g>
</svg>
