<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract pipeline flow representing a lead-to-cash process">
  <defs>
    <style>.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }</style>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#032D60"/>

  <!-- faint grid -->
  <g stroke="#0B5CAB" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- eyebrow -->
  <text x="64" y="76" class="mono" font-size="13" font-weight="500" fill="#03B4A7" letter-spacing="1.5">LEAD → CASH</text>

  <!-- pipeline track -->
  <line x1="96" y1="240" x2="704" y2="240" stroke="#0B5CAB" stroke-width="2"/>
  <!-- progress fill -->
  <line x1="96" y1="240" x2="520" y2="240" stroke="#0176D3" stroke-width="4" stroke-linecap="round"/>

  <!-- stage nodes -->
  <g class="mono" font-size="12" font-weight="500" text-anchor="middle">
    <!-- Lead -->
    <circle cx="96" cy="240" r="18" fill="#0176D3" stroke="#EEF6FD" stroke-width="2"/>
    <path d="M88 240 l6 6 l12 -13" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="290" fill="#EEF6FD">LEAD</text>

    <!-- Opportunity -->
    <circle cx="248" cy="240" r="18" fill="#0176D3" stroke="#EEF6FD" stroke-width="2"/>
    <path d="M240 240 l6 6 l12 -13" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="248" y="290" fill="#EEF6FD">OPP</text>

    <!-- Quote -->
    <circle cx="400" cy="240" r="18" fill="#0176D3" stroke="#EEF6FD" stroke-width="2"/>
    <path d="M392 240 l6 6 l12 -13" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="290" fill="#EEF6FD">QUOTE</text>

    <!-- Order (current) -->
    <circle cx="552" cy="240" r="22" fill="#03B4A7" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="544" y="232" width="16" height="16" rx="3" fill="none" stroke="#032D60" stroke-width="2"/>
    <text x="552" y="294" fill="#FFFFFF">ORDER</text>

    <!-- Cash (pending) -->
    <circle cx="704" cy="240" r="18" fill="#032D60" stroke="#5C6470" stroke-width="2"/>
    <text x="704" y="246" fill="#5C6470" font-size="16">$</text>
    <text x="704" y="290" fill="#5C6470">CASH</text>
  </g>

  <!-- small floating metric card -->
  <g transform="translate(560, 96)">
    <rect x="0" y="0" width="176" height="56" rx="8" fill="#043a75" stroke="#0B5CAB" stroke-width="1.5"/>
    <text x="16" y="26" class="mono" font-size="11" font-weight="500" fill="#5C6470">CYCLE TIME</text>
    <text x="16" y="46" class="mono" font-size="18" font-weight="500" fill="#03B4A7">−38%</text>
  </g>

  <!-- provenance pill -->
  <g transform="translate(64, 366)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="none" stroke="#0176D3" stroke-width="1.5"/>
    <circle cx="18" cy="15" r="4" fill="#03B4A7"/>
    <text x="32" y="19" class="mono" font-size="10" font-weight="500" fill="#EEF6FD">AI-ACCELERATED · SENIOR-REVIEWED</text>
  </g>
</svg>
