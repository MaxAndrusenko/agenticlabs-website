<svg viewBox="0 0 640 520" width="640" height="520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Composite illustration of a code editor panel overlapping an architecture node diagram">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- background field -->
  <rect x="0" y="0" width="640" height="520" fill="#F7F9FB"/>

  <!-- faint grid -->
  <g stroke="#E3E7ED" stroke-width="1" opacity="0.7">
    <line x1="0" y1="130" x2="640" y2="130"/>
    <line x1="0" y1="260" x2="640" y2="260"/>
    <line x1="0" y1="390" x2="640" y2="390"/>
    <line x1="160" y1="0" x2="160" y2="520"/>
    <line x1="320" y1="0" x2="320" y2="520"/>
    <line x1="480" y1="0" x2="480" y2="520"/>
  </g>

  <!-- ARCHITECTURE NODE DIAGRAM (background layer) -->
  <g>
    <!-- connectors -->
    <g stroke="#5C6470" stroke-width="1.5" fill="none" opacity="0.55">
      <path d="M150 150 L 300 220"/>
      <path d="M470 130 L 340 210"/>
      <path d="M420 340 L 320 250"/>
      <path d="M180 360 L 300 250"/>
      <path d="M470 130 L 520 250 L 440 350"/>
    </g>

    <!-- outer nodes -->
    <g>
      <!-- node top-left -->
      <rect x="96" y="120" width="108" height="56" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
      <circle cx="118" cy="148" r="7" fill="none" stroke="#0176D3" stroke-width="1.8"/>
      <text x="136" y="145" class="mono" font-size="10" font-weight="500" fill="#16181D">SALES</text>
      <text x="136" y="158" class="mono" font-size="10" font-weight="500" fill="#5C6470">CLOUD</text>

      <!-- node top-right -->
      <rect x="424" y="100" width="112" height="56" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
      <rect x="443" y="121" width="14" height="14" rx="3" fill="none" stroke="#03B4A7" stroke-width="1.8"/>
      <text x="466" y="125" class="mono" font-size="10" font-weight="500" fill="#16181D">MULE</text>
      <text x="466" y="138" class="mono" font-size="10" font-weight="500" fill="#5C6470">SOFT</text>

      <!-- node bottom-left -->
      <rect x="118" y="332" width="112" height="56" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
      <path d="M137 353 h14 M137 360 h14 M137 367 h8" stroke="#0176D3" stroke-width="1.8" stroke-linecap="round"/>
      <text x="160" y="357" class="mono" font-size="10" font-weight="500" fill="#16181D">DATA</text>
      <text x="160" y="370" class="mono" font-size="10" font-weight="500" fill="#5C6470">MODEL</text>

      <!-- node bottom-right -->
      <rect x="384" y="322" width="112" height="56" rx="8" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
      <path d="M403 350 l6 -8 l6 6 l6 -10" fill="none" stroke="#7526E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="426" y="347" class="mono" font-size="10" font-weight="500" fill="#16181D">AGENT</text>
      <text x="426" y="360" class="mono" font-size="10" font-weight="500" fill="#5C6470">FORCE</text>
    </g>

    <!-- central hub node -->
    <circle cx="320" cy="230" r="30" fill="#EEF6FD" stroke="#0176D3" stroke-width="2"/>
    <circle cx="320" cy="230" r="30" fill="none" stroke="#0176D3" stroke-width="2" stroke-dasharray="3 5" opacity="0.4"/>
    <path d="M308 230 l7 7 l14 -15" fill="none" stroke="#0176D3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- node dots on connectors -->
    <g fill="#0176D3">
      <circle cx="225" cy="185" r="3"/>
      <circle cx="405" cy="170" r="3"/>
      <circle cx="370" cy="295" r="3"/>
      <circle cx="240" cy="305" r="3"/>
    </g>
  </g>

  <!-- CODE EDITOR CHROME (foreground layer) -->
  <g transform="translate(212, 260)">
    <!-- panel shadow -->
    <rect x="4" y="8" width="368" height="212" rx="12" fill="#032D60" opacity="0.10"/>
    <!-- panel -->
    <rect x="0" y="0" width="368" height="212" rx="12" fill="#FFFFFF" stroke="#E3E7ED" stroke-width="1.5"/>
    <!-- title bar -->
    <path d="M0 12 a12 12 0 0 1 12 -12 h344 a12 12 0 0 1 12 12 v28 h-368 z" fill="#032D60"/>
    <!-- traffic-light dots -->
    <circle cx="22" cy="20" r="5" fill="#BA0517"/>
    <circle cx="40" cy="20" r="5" fill="#E3E7ED"/>
    <circle cx="58" cy="20" r="5" fill="#03B4A7"/>
    <!-- filename tab -->
    <rect x="96" y="10" width="128" height="20" rx="5" fill="#0B5CAB"/>
    <text x="110" y="24" class="mono" font-size="10" font-weight="500" fill="#FFFFFF">LeadRouter.cls</text>

    <!-- gutter -->
    <line x1="40" y1="48" x2="40" y2="204" stroke="#E3E7ED" stroke-width="1"/>
    <g class="mono" font-size="10" font-weight="500" fill="#5C6470" text-anchor="end">
      <text x="30" y="66">1</text>
      <text x="30" y="88">2</text>
      <text x="30" y="110">3</text>
      <text x="30" y="132">4</text>
      <text x="30" y="154">5</text>
      <text x="30" y="176">6</text>
      <text x="30" y="198">7</text>
    </g>

    <!-- code lines -->
    <g class="mono" font-size="11" font-weight="500">
      <text x="52" y="66"><tspan fill="#5C6470">// AI drafts, senior reviews</tspan></text>
      <text x="52" y="88"><tspan fill="#0176D3">public class</tspan><tspan fill="#16181D"> LeadRouter {</tspan></text>
      <text x="52" y="110"><tspan fill="#16181D">  </tspan><tspan fill="#0176D3">void</tspan><tspan fill="#16181D"> route(</tspan><tspan fill="#7526E3">Lead</tspan><tspan fill="#16181D"> l) {</tspan></text>
      <text x="52" y="132"><tspan fill="#16181D">    l.owner = </tspan><tspan fill="#03B4A7">assignOwner</tspan><tspan fill="#16181D">(l);</tspan></text>
      <text x="52" y="154"><tspan fill="#16181D">    </tspan><tspan fill="#0176D3">if</tspan><tspan fill="#16181D"> (l.score &gt; </tspan><tspan fill="#03B4A7">80</tspan><tspan fill="#16181D">)</tspan></text>
      <text x="52" y="176"><tspan fill="#16181D">      escalate(l);</tspan></text>
      <text x="52" y="198"><tspan fill="#16181D">  } }</tspan></text>
    </g>

    <!-- cursor -->
    <rect x="128" y="188" width="2" height="12" fill="#0176D3"/>
  </g>

  <!-- floating provenance label -->
  <g transform="translate(24, 40)">
    <rect x="0" y="0" width="228" height="30" rx="15" fill="#EEF6FD" stroke="#0176D3" stroke-width="1.5"/>
    <circle cx="18" cy="15" r="4" fill="#0176D3"/>
    <text x="32" y="19" class="mono" font-size="10" font-weight="500" fill="#0B5CAB">AI-ACCELERATED · SENIOR-REVIEWED</text>
  </g>
</svg>
