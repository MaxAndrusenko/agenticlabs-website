<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration contrasting AI-accelerated and AI-generated work with human review">
  <defs>
    <style>.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }</style>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#EEF6FD"/>

  <!-- grid -->
  <g stroke="#D5E8F9" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
  </g>

  <text x="64" y="72" class="mono" font-size="13" font-weight="500" fill="#0B5CAB" letter-spacing="1.5">AI-ACCELERATED, NOT AI-GENERATED</text>

  <!-- Stage 1: AI drafts (fast, dashed) -->
  <g transform="translate(96, 150)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#FFFFFF" stroke="#7526E3" stroke-width="1.8" stroke-dasharray="6 5"/>
    <!-- spark / AI mark -->
    <path d="M75 40 l10 26 l26 10 l-26 10 l-10 26 l-10 -26 l-26 -10 l26 -10 z" fill="none" stroke="#7526E3" stroke-width="2" stroke-linejoin="round"/>
    <text x="75" y="132" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#7526E3">AI DRAFTS</text>
  </g>

  <!-- arrow 1 -->
  <path d="M262 225 h56" fill="none" stroke="#5C6470" stroke-width="2" stroke-linecap="round"/>
  <path d="M312 218 l10 7 l-10 7" fill="none" stroke="#5C6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 2: human reviews (solid, checked) -->
  <g transform="translate(334, 150)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#FFFFFF" stroke="#0176D3" stroke-width="2"/>
    <!-- reviewer glyph: doc with checkmark -->
    <rect x="52" y="40" width="46" height="58" rx="6" fill="none" stroke="#0176D3" stroke-width="2"/>
    <path d="M62 62 h26 M62 72 h26 M62 82 h16" stroke="#0176D3" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="98" cy="94" r="16" fill="#EEF6FD" stroke="#2E844A" stroke-width="2"/>
    <path d="M90 94 l6 6 l10 -12" fill="none" stroke="#2E844A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="132" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#0B5CAB">SENIOR REVIEW</text>
  </g>

  <!-- arrow 2 -->
  <path d="M500 225 h56" fill="none" stroke="#5C6470" stroke-width="2" stroke-linecap="round"/>
  <path d="M550 218 l10 7 l-10 7" fill="none" stroke="#5C6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 3: shipped -->
  <g transform="translate(572, 150)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#032D60" stroke="#032D60" stroke-width="2"/>
    <circle cx="75" cy="66" r="30" fill="none" stroke="#03B4A7" stroke-width="2.4"/>
    <path d="M60 66 l10 10 l22 -24" fill="none" stroke="#03B4A7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="132" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#EEF6FD">SHIPPED</text>
  </g>

  <!-- footer note -->
  <text x="64" y="392" class="mono" font-size="11" font-weight="500" fill="#5C6470">THE MODEL TYPES · THE ARCHITECT DECIDES</text>
</svg>
