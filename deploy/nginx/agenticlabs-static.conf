server {
    listen 80;
    listen [::]:80;
    server_name agenticlabs.cloud www.agenticlabs.cloud;

    root /var/www/agenticlabs/current;
    index index.html;

    access_log /var/log/nginx/agenticlabs.access.log;
    error_log /var/log/nginx/agenticlabs.error.log;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        if ($request_uri = /index.html) {
            return 301 /;
        }

        try_files /index.html =404;
    }

    location ~ ^/(.+)\.html$ {
        if ($request_uri ~ ^/(.+)\.html$) {
            return 301 /$1;
        }

        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    error_page 404 /404;

    # Later, when an Express API exists, run it on 127.0.0.1:3000 and add:
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
